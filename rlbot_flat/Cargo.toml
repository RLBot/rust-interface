[package]
name = "rlbot_flat"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "FlatBuffers-generated types for the RLBot socket API. Most users want the `rlbot` crate instead."
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["flatbuffers", "rlbot"]
categories = ["encoding"]

exclude = ["codegen/", "examples/regen.rs"]

[dependencies]
glam = { version = "0.33.0", optional = true }
planus = "1.3.0"
serde = { version = "1.0.210", features = ["derive"] }

[dev-dependencies]
eyre = "0.6.12"
fluent-uri = "0.4.1"
planus-codegen = "1.3.0"
planus-translation = "1.3.0"
planus-types = "1.3.0"

[features]
default = ["glam"]
glam = ["dep:glam"]
